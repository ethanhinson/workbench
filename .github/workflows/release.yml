# Publish prebuilt workbench binaries to a GitHub Release on every v* tag.
# The tag name is stamped into the binary via -ldflags so `workbench --version`
# reports the released version. Brew/npm distribution (change #3, deferred) will
# consume these same release artifacts.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the Release and upload assets

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME}"
          dist="workbench_${version}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${dist}"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${version}" \
            -o "dist/${dist}/workbench" ./cmd/workbench
          cp README.md LICENSE "dist/${dist}/" 2>/dev/null || true
          tar -C dist -czf "${dist}.tar.gz" "${dist}"
          shasum -a 256 "${dist}.tar.gz" > "${dist}.tar.gz.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workbench_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            workbench_*.tar.gz
            workbench_*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/workbench_*.tar.gz
            dist/workbench_*.tar.gz.sha256
          generate_release_notes: true
