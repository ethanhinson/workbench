<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>kanban-mcp</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230f1115'/></svg>" />
<!-- markdown + mermaid rendering for spec detail (local dev tool; CDN is fine) -->
<script src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  mermaid.initialize({ startOnLoad:false, theme:"dark", securityLevel:"loose" });
  window.__mermaid = mermaid;
</script>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#272b35; --muted:#8b93a7; --fg:#e6e9f0;
    --p0:#ff5d5d; --p1:#ff9f43; --p2:#5b8def; --p3:#4b5163;
    --spec-missing:#6b7280; --spec-draft:#c9a227; --spec-approved:#2ecc71; --blocked:#ff5d5d;
    --accent:#5b8def;
  }
  * { box-sizing:border-box; }
  html, body { height:100vh; overflow:hidden; }
  /* full-height flex column: header on top, board fills the rest; only lane
     bodies scroll — the page itself never scrolls, so the header stays put. */
  body { margin:0; font:14px/1.4 ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg);
         display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  header { display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--line);
           flex:0 0 auto; background:var(--bg); z-index:5; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  .tag { font-size:11px; color:var(--muted); border:1px solid var(--line); padding:2px 8px; border-radius:999px; }
  .spacer { flex:1; }
  .tabs { display:flex; gap:4px; }
  .tab { padding:5px 14px; border-radius:8px 8px 0 0; cursor:pointer; color:var(--muted); border:1px solid transparent; font-weight:500; }
  .tab.active { color:var(--fg); background:var(--panel); border-color:var(--line); border-bottom-color:var(--panel); }
  .tab .count { font-size:11px; color:var(--muted); margin-left:6px; }
  .stats { display:flex; gap:12px; font-size:12px; color:var(--muted); }
  /* the board fills the viewport below the header; lanes scroll internally */
  .board { padding:12px; flex:1 1 auto; min-height:0; overflow-x:auto; overflow-y:hidden; display:flex; }
  /* vertical swim lanes (classic kanban): full-height columns, cards stack + scroll */
  .lanes { display:flex; gap:12px; align-items:stretch; flex:1 1 auto; min-height:0; }
  .laneCol { flex:1 1 0; min-width:240px; background:#12151c; border:1px solid var(--line); border-radius:10px;
             display:flex; flex-direction:column; min-height:0; }
  .laneHead { padding:9px 12px; font-weight:600; font-size:13px; border-bottom:1px solid var(--line);
              flex:0 0 auto; background:#12151c; border-radius:10px 10px 0 0; display:flex; align-items:center; }
  .laneHead .count { margin-left:auto; font-size:11px; color:var(--muted); background:var(--panel2);
                     border-radius:999px; padding:1px 8px; }
  .laneBody { padding:8px; flex:1 1 auto; min-height:0; overflow-y:auto; }
  .badge.stage { color:var(--fg); background:var(--panel2); border-color:var(--line); text-transform:capitalize; }
  /* fixed layout so every column is equal width — no runaway middle lane */
  table { border-collapse:collapse; width:100%; table-layout:fixed; }
  col.lanecol { width:130px; }
  th.col { text-align:left; padding:8px 10px; color:var(--muted); font-weight:600; font-size:11px;
           text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid var(--line); white-space:nowrap; }
  th.lane { text-align:left; padding:10px; font-weight:600; vertical-align:top; border-right:1px solid var(--line);
            white-space:nowrap; position:sticky; left:0; background:var(--bg); }
  td.cell { vertical-align:top; padding:6px; border-bottom:1px solid var(--line); border-right:1px dashed var(--line);
            overflow:hidden; }
  .card { background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--p2); border-radius:8px;
          padding:7px 9px; margin-bottom:7px; cursor:pointer; overflow:hidden; }
  .card:hover { border-color:#3a3f4b; background:var(--panel2); }
  .card.p0 { border-left-color:var(--p0); } .card.p1 { border-left-color:var(--p1); }
  .card.p2 { border-left-color:var(--p2); } .card.p3 { border-left-color:var(--p3); }
  .card.blocked { box-shadow:inset 3px 0 0 var(--blocked); }
  .card .kind { font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  /* clamp title to 2 lines with ellipsis */
  .card .title { font-weight:500; margin:2px 0; font-size:13px; line-height:1.3;
                 display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .badges { display:flex; align-items:center; gap:5px; flex-wrap:wrap; margin-top:6px; }
  .badge { font-size:10px; padding:1px 6px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .badge.spec-missing { color:var(--spec-missing); }
  .badge.spec-draft { color:var(--spec-draft); border-color:var(--spec-draft); }
  .badge.spec-approved { color:var(--spec-approved); border-color:var(--spec-approved); }
  .badge.blocked { color:#fff; background:var(--blocked); border-color:var(--blocked); }
  .badge.dep { color:var(--accent); border-color:var(--accent); cursor:pointer; }
  .badge.dep:hover { background:var(--accent); color:#fff; }
  .empty { color:var(--muted); font-size:12px; padding:6px; }
  /* Done: a plain vertical list of clickable ticket rows */
  .donelist { flex:1 1 auto; min-height:0; overflow-y:auto; display:flex; flex-direction:column;
              border:1px solid var(--line); border-radius:10px; }
  .doneRow { display:flex; align-items:center; gap:12px; padding:9px 14px; cursor:pointer;
             border-bottom:1px solid var(--line); }
  .doneRow:last-child { border-bottom:none; }
  .doneRow:hover { background:var(--panel2); }
  .dr-id { color:var(--accent); font-weight:600; font-size:13px; flex:0 0 52px; }
  .dr-title { flex:1 1 auto; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dr-meta { display:flex; align-items:center; gap:6px; flex:0 0 auto; }
  .badge.dr-col { text-transform:capitalize; }
  .badge.dr-col.done { color:var(--spec-approved); border-color:var(--spec-approved); }
  .badge.dr-col.killed { color:var(--blocked); border-color:var(--blocked); }
  /* detail drawer */
  #drawer { position:fixed; top:0; right:0; height:100%; width:min(560px,92%); background:var(--panel);
            border-left:1px solid var(--line); transform:translateX(100%); transition:transform .15s ease; z-index:20;
            display:flex; flex-direction:column; }
  #drawer.open { transform:translateX(0); }
  #drawer header { border-bottom:1px solid var(--line); }
  #drawer .body { overflow:auto; padding:16px; }
  #drawer h2 { margin:4px 0 8px; font-size:17px; }
  .deplist { margin:6px 0 14px; }
  .deprow { padding:6px 8px; border:1px solid var(--line); border-radius:6px; margin-bottom:5px; cursor:pointer; display:flex; gap:8px; }
  .deprow:hover { background:var(--panel2); }
  .deprow .id { color:var(--accent); font-weight:600; }
  .section-h { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:16px 0 6px; }
  pre.spec { white-space:pre-wrap; word-break:break-word; background:#0c0e12; border:1px solid var(--line);
             border-radius:8px; padding:12px; font:12px/1.5 ui-monospace,Menlo,monospace; max-height:45vh; overflow:auto; }
  /* rendered markdown */
  .md { background:#0c0e12; border:1px solid var(--line); border-radius:8px; padding:14px 16px; overflow:auto; max-height:55vh; }
  .md h1,.md h2,.md h3 { margin:14px 0 8px; line-height:1.3; }
  .md h1 { font-size:19px; } .md h2 { font-size:16px; } .md h3 { font-size:14px; }
  .md p,.md li { font-size:13px; line-height:1.55; }
  .md ul,.md ol { padding-left:20px; }
  .md code { background:#1a1e27; padding:1px 5px; border-radius:4px; font:12px ui-monospace,Menlo,monospace; }
  .md pre { background:#161a22; border:1px solid var(--line); border-radius:6px; padding:10px; overflow:auto; }
  .md pre code { background:none; padding:0; }
  .md table { border-collapse:collapse; margin:8px 0; }
  .md th,.md td { border:1px solid var(--line); padding:4px 8px; font-size:12px; }
  .md blockquote { border-left:3px solid var(--line); margin:8px 0; padding-left:12px; color:var(--muted); }
  .md a { color:var(--accent); }
  .md .mermaid { background:#0c0e12; text-align:center; margin:10px 0; }
  .close { cursor:pointer; color:var(--muted); font-size:20px; padding:0 6px; }
  .backdrop { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:15; display:none; }
  .backdrop.open { display:block; }
</style>
</head>
<body>
<header>
  <h1>kanban-mcp</h1>
  <span class="tag" id="plan-tag">—</span>
  <div class="tabs" id="tabs"></div>
  <div class="spacer"></div>
  <div class="stats" id="stats"></div>
  <span class="tag" id="live">○</span>
</header>

<div class="board" id="board"><div class="empty">loading…</div></div>

<div class="backdrop" id="backdrop" onclick="closeDrawer()"></div>
<div id="drawer">
  <header>
    <strong style="flex:1" id="drawer-title">—</strong>
    <span class="close" onclick="closeDrawer()">✕</span>
  </header>
  <div class="body" id="drawer-body"></div>
</div>

<script>
const $ = (s)=>document.querySelector(s);
let SNAP = null;
let TAB = "inflight";       // backlog | inflight | done
const params = new URLSearchParams(location.search);
if (params.get("tab")) TAB = params.get("tab");

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function itemById(id){ return (SNAP.items||[]).find(i=>i.id===id); }
function viewDef(kind){ return (SNAP.views||[]).find(v=>v.kind===kind); }
function specBadge(s){ return `<span class="badge spec-${s}">spec:${s}</span>`; }

// dependency chips for a card (outgoing depends_on only, compact)
function depChips(it){
  const deps = (SNAP.links||[]).filter(l=>l.from===it.id && l.kind==="depends_on");
  if (!deps.length) return "";
  return deps.slice(0,4).map(l=>{
    const t = itemById(l.to);
    const label = t ? shortRef(t) : "?";
    return `<span class="badge dep" onclick="openDrawer('${l.to}');event.stopPropagation()">↳ ${esc(label)}</span>`;
  }).join("");
}
function shortRef(it){
  const m = /^#(\d+)/.exec(it.title); return m ? "#"+m[1] : it.title.slice(0,10);
}

// card renders one ticket. colName is the second-axis value for this view
// (priority in Backlog, progress in In-Flight) shown as a status badge.
function card(it, colName){
  const badges = [
    (typeof colName==="string" && colName) ? `<span class="badge stage">${esc(colName)}</span>` : `<span class="badge">${esc(it.priority)}</span>`,
    specBadge(it.spec_status),
    it.blocked ? `<span class="badge blocked">blocked</span>` : "",
    depChips(it),
  ].join("");
  return `<div class="card ${it.priority} ${it.blocked?'blocked':''}" onclick="openDrawer('${it.id}')">
    <div class="kind">${it.kind}</div>
    <div class="title">${esc(it.title)}</div>
    <div class="badges">${badges}</div>
  </div>`;
}

// renderGrid draws lanes as VERTICAL columns (classic kanban): each swim lane is
// a column, tickets stack in it. The old second axis (priority/progress) becomes
// a badge on the card and the within-lane sort key.
function renderGrid(kind){
  const vd = viewDef(kind);
  const items = (SNAP.items||[]).filter(i=>i.views && i.views[kind]);
  const colName = {}; // column key -> display name (for the per-card badge)
  vd.columns.forEach((c,i)=>{ colName[c.key] = c.name; c._ord = i; });
  const colOrd = {}; vd.columns.forEach((c,i)=>colOrd[c.key]=i);

  // group items by lane
  const byLane = {};
  for (const it of items){ const p=it.views[kind]; (byLane[p.lane] ||= []).push(it); }
  // sort within a lane by the second axis (progress/priority order), then title
  for (const k in byLane){
    byLane[k].sort((a,b)=>{
      const oa=colOrd[a.views[kind].column]??9, ob=colOrd[b.views[kind].column]??9;
      return oa-ob || a.title.localeCompare(b.title);
    });
  }

  let html = `<div class="lanes">`;
  for (const lane of vd.lanes){
    const list = byLane[lane.key]||[];
    html += `<div class="laneCol">
      <div class="laneHead">${esc(lane.name)}<span class="count">${list.length}</span></div>
      <div class="laneBody">${
        list.length ? list.map(it=>card(it, colName[it.views[kind].column])).join("")
                    : '<div class="empty">—</div>'
      }</div>
    </div>`;
  }
  html += `</div>`;
  return html;
}

function renderDone(){
  const items = (SNAP.items||[]).filter(i=>i.views && i.views.done);
  if (!items.length) return `<div class="empty">nothing closed yet</div>`;
  // Sort by id desc (newest first) — extract the leading #N when present.
  const num = it => { const m=/^#(\d+)/.exec(it.title); return m?+m[1]:0; };
  const sorted = [...items].sort((a,b)=>num(b)-num(a));
  return `<div class="donelist">${sorted.map(doneRow).join("")}</div>`;
}

// doneRow renders one closed ticket as a compact clickable list row.
function doneRow(it){
  const m = /^#(\d+)\s*(.*)/.exec(it.title);
  const id = m ? "#"+m[1] : "";
  const title = m ? m[2] : it.title;
  const col = it.column_key;
  return `<div class="doneRow" onclick="openDrawer('${it.id}')">
    <span class="dr-id">${esc(id)}</span>
    <span class="dr-title">${esc(title)}</span>
    <span class="dr-meta">
      <span class="badge ${it.kind==='bug'?'':''}">${esc(it.kind)}</span>
      ${specBadge(it.spec_status)}
      <span class="badge dr-col ${col}">${esc(col)}</span>
    </span>
  </div>`;
}

function render(){
  if (!SNAP){ return; }
  $("#plan-tag").textContent = SNAP.plan.name;
  // tabs with counts
  const counts = {backlog:0,inflight:0,done:0};
  for (const it of SNAP.items||[]) for (const k of Object.keys(it.views||{})) counts[k]++;
  const tabDefs = [["inflight","In-Flight"],["backlog","Backlog"],["done","Done"]];
  $("#tabs").innerHTML = tabDefs.map(([k,n])=>
    `<div class="tab ${TAB===k?'active':''}" onclick="setTab('${k}')">${n}<span class="count">${counts[k]}</span></div>`).join("");
  $("#stats").innerHTML = `<span>${SNAP.stats.total_items} total</span><span>${SNAP.stats.blocked} blocked</span>`;

  $("#board").innerHTML = TAB==="done" ? renderDone() : renderGrid(TAB);
}

function setTab(k){ TAB=k; const u=new URL(location); u.searchParams.set("tab",k); history.replaceState({},"",u); render(); }

// ---- detail drawer ----
async function openDrawer(id){
  $("#backdrop").classList.add("open"); $("#drawer").classList.add("open");
  $("#drawer-body").innerHTML = `<div class="empty">loading…</div>`;
  try {
    const d = await (await fetch("/api/item/"+id)).json();
    renderDrawer(d);
  } catch(e){ $("#drawer-body").innerHTML = `<div class="empty">error: ${e}</div>`; }
}
function closeDrawer(){ $("#backdrop").classList.remove("open"); $("#drawer").classList.remove("open"); }

function refRow(r){
  return `<div class="deprow" onclick="openDrawer('${r.id}')"><span class="id">${esc(refLabel(r))}</span>
    <span>${esc(r.title.replace(/^#\d+\s*/,''))}</span><span style="margin-left:auto" class="tag">${esc(r.column)}</span></div>`;
}
function refLabel(r){ const m=/^#(\d+)/.exec(r.title); return m?"#"+m[1]:(r.ext_key||r.id.slice(0,6)); }

function renderDrawer(d){
  const it = d.item;
  $("#drawer-title").textContent = it.title;
  let h = `<div class="kind">${it.kind} · ${it.priority} · ${it.column_key}${it.lane_key?' · '+it.lane_key:''}</div>`;
  h += `<h2>${esc(it.title)}</h2>`;
  h += `<div class="badges">${specBadge(it.spec_status)}${it.blocked?`<span class="badge blocked">blocked: ${esc(it.blocked_reason||'')}</span>`:''}`;
  h += (it.labels||[]).map(l=>`<span class="badge">${l.ns}:${l.value}</span>`).join("")+`</div>`;

  if (d.depends_on&&d.depends_on.length){ h+=`<div class="section-h">Depends on</div><div class="deplist">${d.depends_on.map(refRow).join("")}</div>`; }
  if (d.depended_by&&d.depended_by.length){ h+=`<div class="section-h">Blocks / depended on by</div><div class="deplist">${d.depended_by.map(refRow).join("")}</div>`; }
  if (d.related&&d.related.length){ h+=`<div class="section-h">Related</div><div class="deplist">${d.related.map(refRow).join("")}</div>`; }

  if (it.spec_ref) h += `<div class="section-h">Spec — ${esc(it.spec_ref)}</div>`;
  if (d.spec_content) h += `<div class="md" id="spec-md"></div>`;
  else if (it.spec_ref) h += `<div class="empty">spec file not found under repo root (pass --repo-root)</div>`;
  if (it.body) h += `<div class="section-h">Notes</div><div class="md" id="body-md"></div>`;
  h += `<div class="section-h">id</div><div class="tag">${it.id}${it.ext_key?' · '+it.ext_key:''}</div>`;
  $("#drawer-body").innerHTML = h;

  // Render markdown (with mermaid) into the placeholders after insertion.
  if (d.spec_content) renderMarkdown($("#spec-md"), d.spec_content);
  if (it.body) renderMarkdown($("#body-md"), it.body);
}

// renderMarkdown turns markdown text into HTML, then upgrades ```mermaid fences
// into rendered diagrams. markdown-it escapes HTML by default (html:false), so
// this is safe against injected markup in spec files.
let _md = null, _mmid = 0;
function renderMarkdown(el, text){
  if (!el) return;
  if (!_md && window.markdownit) _md = window.markdownit({ html:false, linkify:true, breaks:false });
  if (!_md){ el.innerHTML = `<pre class="spec">${esc(text)}</pre>`; return; }
  el.innerHTML = _md.render(text);
  // Convert <pre><code class="language-mermaid"> blocks into mermaid diagrams.
  el.querySelectorAll('pre > code.language-mermaid, code.language-mermaid').forEach(code=>{
    const pre = code.closest('pre') || code;
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = code.textContent;
    pre.replaceWith(div);
  });
  const nodes = el.querySelectorAll('.mermaid');
  if (nodes.length && window.__mermaid){
    nodes.forEach(n=>{ n.id = 'mmd-'+(_mmid++); });
    window.__mermaid.run({ nodes:[...nodes] }).catch(()=>{});
  }
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDrawer(); });

// ---- live via SSE ----
// Paint immediately from a one-shot fetch (so first render doesn't wait on the
// SSE frame), then keep live over the stream.
async function initialLoad(){
  try{
    const snap = await (await fetch("/api/board")).json();
    if (SNAP===null){ SNAP=snap; render(); if (params.get("open")) openDrawer(resolveOpen(params.get("open"))); }
  }catch(e){}
}
function connect(){
  const es = new EventSource("/api/stream");
  es.addEventListener("board",(ev)=>{
    try{
      const first = SNAP===null;
      SNAP=JSON.parse(ev.data); $("#live").textContent="● live"; render();
      if (first && params.get("open")) openDrawer(resolveOpen(params.get("open")));
    }catch(e){}
  });
  es.onerror=()=>{ $("#live").textContent="○ reconnecting"; };
}
initialLoad();
// resolveOpen accepts an item id or an ext_key (e.g. docket:74) to auto-open.
function resolveOpen(key){
  const byExt = (SNAP.items||[]).find(i=>i.ext_key===key);
  return byExt ? byExt.id : key;
}
connect();
</script>
</body>
</html>
